<!doctype html><meta charset="utf-8"><title>Chat handoff fixture</title>
<style>body{font:14px system-ui;margin:12px}textarea,[contenteditable]{width:90%;min-height:100px;border:1px solid #999;padding:8px}button{padding:8px}</style>
<body data-changes="0" data-sends="0"><p>Test-only web composer</p><div data-message-author-role="user" data-message-id="q-one">What is the result?</div><div data-message-author-role="assistant" data-message-id="a-one"><div class="markdown">WEB_FACT_MARKER: the controller reduced spill risk.</div></div><textarea id="prompt-textarea">Existing draft</textarea><input id="files" type="file" multiple accept="image/png,application/pdf"><button id="send">Send</button>
<script>document.getElementById('files').addEventListener('change',()=>document.body.dataset.changes=String(Number(document.body.dataset.changes)+1));document.getElementById('send').addEventListener('click',()=>document.body.dataset.sends=String(Number(document.body.dataset.sends)+1));</script>
